name: Android Release (signed APK)

# Triggered when a `v*` tag is pushed (e.g. `v1.4`, `v1.4.0`, `v2.0-beta1`).
# The tag MUST point at a commit that lives on `master` — feature work
# happens on `develop`, maintainers cut releases by merging `develop` into
# `master` and tagging there. See CONTRIBUTING.md for the full flow.
#
# Outputs:
#   - A release-signed APK (v1+v2+v3 APK Signing Scheme)
#   - SHA-256 checksum file
#   - `apksigner verify --print-certs` output for auditability
# Published as a GitHub Release attached to the pushed tag.
#
# -----------------------------------------------------------------------
# One-time setup: create an upload keystore + register the secrets.
# -----------------------------------------------------------------------
#
# 1. Generate the keystore (do this once, on a trusted machine, then
#    archive the .keystore file in a password manager / KMS — losing it
#    locks you out of publishing updates with the same signing identity):
#
#      keytool -genkeypair -v \
#        -keystore release.keystore \
#        -alias referendum-upload \
#        -keyalg RSA -keysize 4096 -validity 25000 \
#        -storepass '<PICK-A-STRONG-PASSWORD>' \
#        -keypass  '<PICK-A-STRONG-PASSWORD>' \
#        -dname    'CN=Referendum Citoyen, OU=Releases, O=Referendum, C=FR'
#
# 2. Base64-encode it for transport into a GitHub secret:
#
#      base64 -w0 release.keystore > release.keystore.b64
#
# 3. In GitHub → Settings → Secrets and variables → Actions → New secret,
#    add the four secrets below (the names are read by this workflow):
#
#      ANDROID_KEYSTORE_BASE64    contents of release.keystore.b64
#      ANDROID_KEYSTORE_PASSWORD  the -storepass value above
#      ANDROID_KEY_ALIAS          referendum-upload
#      ANDROID_KEY_PASSWORD       the -keypass value above
#
# 4. Cut a release: from a clean `master` checkout, `git tag -a v1.4 -m '…'`
#    then `git push origin v1.4`. This workflow runs, verifies the tag is
#    on master, builds, signs, and publishes the Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build & publish (e.g. v1.4). Must be on master."
        required: true
        type: string

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # required to attach the APK to a GitHub Release

jobs:
  release:
    name: Build, sign, and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]'; then
            echo "::error::Tag '$tag' does not match v[0-9]* — refusing to release."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0   # need history for the merge-base check below

      - name: Verify tag is on master
        # Hard guarantee: the commit pointed to by the tag must be an
        # ancestor of origin/master. Stops a maintainer from accidentally
        # tagging develop / a feature branch and shipping it.
        run: |
          set -euo pipefail
          git fetch origin master --depth=200
          tag_sha=$(git rev-parse "${{ steps.tag.outputs.tag }}^{commit}")
          if ! git merge-base --is-ancestor "$tag_sha" origin/master; then
            echo "::error::Tag ${{ steps.tag.outputs.tag }} ($tag_sha) is not on master."
            echo "::error::Releases must be cut from master. See CONTRIBUTING.md."
            exit 1
          fi

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install JS dependencies
        run: npm ci

      - name: Build withNfc plugin
        run: |
          cd plugins/withNfc.plugin
          npm install --no-audit --no-fund --ignore-scripts
          npx tsc

      - name: Expo prebuild (android)
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_NO_CAPABILITY_SYNC: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Decode keystore from secret
        # The keystore is written outside the workspace so it doesn't end up
        # in a Gradle/Expo `clean` sweep, and so the absolute path is stable.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set. See the workflow header for one-time setup."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          # Sanity-check it parsed as a keystore (without printing contents).
          file "$RUNNER_TEMP/keystore/release.keystore"

      - name: Inject release signing config
        run: node scripts/ci/inject-android-signing.mjs

      - name: Grant gradlew execute perms
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        env:
          REFCIT_RELEASE_STORE_FILE: ${{ runner.temp }}/keystore/release.keystore
          REFCIT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REFCIT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REFCIT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$apk"
          name="referendum-citoyen-${{ steps.tag.outputs.tag }}.apk"
          cp "$apk" "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/$name"

      - name: Verify APK signature
        # apksigner ships in build-tools; setup-android puts it on PATH.
        # `--print-certs` writes the signing cert SHA-256 to the log so an
        # auditor can compare it against the keystore fingerprint out of band.
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs "${{ steps.apk.outputs.path }}" \
            | tee "$RUNNER_TEMP/apksigner-verify.txt"

      - name: Compute SHA-256
        id: checksum
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum "${{ steps.apk.outputs.name }}" > "${{ steps.apk.outputs.name }}.sha256"
          cat "${{ steps.apk.outputs.name }}.sha256"
          echo "path=$RUNNER_TEMP/${{ steps.apk.outputs.name }}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        # Keep an artifact copy too, so re-running for diagnostics doesn't
        # depend on the GitHub Release being intact.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.checksum.outputs.path }}
            ${{ runner.temp }}/apksigner-verify.txt
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.checksum.outputs.path }}
            ${{ runner.temp }}/apksigner-verify.txt
          body: |
            Signed Android release for `${{ steps.tag.outputs.tag }}`.

            Verify the download:

            ```
            sha256sum -c ${{ steps.apk.outputs.name }}.sha256
            apksigner verify --print-certs ${{ steps.apk.outputs.name }}
            ```

            The expected signing cert SHA-256 is in the attached
            `apksigner-verify.txt`.
